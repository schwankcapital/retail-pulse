[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pulse"
version = "0.1.0"
description = "Evidence-grounded retail availability, inventory reconciliation and demand intelligence"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
  "opencv-python-headless>=4.10,<5", "Pillow>=10,<13", "imageio-ffmpeg>=0.5,<1"
]
[project.optional-dependencies]
data = ["pyarrow>=18,<27", "duckdb>=1.4,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
[project.scripts]
retail-pulse = "retail_pulse.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
retail_pulse = ["web/*", "prompts/*.txt"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
target-version = "py311"
